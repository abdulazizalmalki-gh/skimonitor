[package]
name = "skimonitor"
version = "0.3.1"
edition = "2021"
description = "Multi-host SSH monitoring: CPU/mem/disk/net/GPU/per-core load/temps, as a TUI or the same screen in a browser (--web)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
