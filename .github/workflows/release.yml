name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: linux-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            arch: macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            arch: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf skimonitor-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz skimonitor
          shasum -a 256 skimonitor-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skimonitor-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/*.tar.gz
            target/${{ matrix.target }}/release/sha256sums.txt
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
