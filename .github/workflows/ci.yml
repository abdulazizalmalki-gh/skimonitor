name: ci
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "README.md", "LICENSE"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: probe smoke + unit tests
        run: bash dev/test_probe.sh
      - name: probe syntax check
        run: bash -n probe.sh
      - name: smoke (local host, one frame)
        run: ./target/release/skimonitor --once local
      - name: serve smoke (--web, one rendered frame)
        run: |
          ./target/release/skimonitor --web --demo -p 8399 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8399/health >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8399/ >/dev/null
          curl -sf http://127.0.0.1:8399/app.js >/dev/null
          curl -sf http://127.0.0.1:8399/style.css >/dev/null
          curl -sf "http://127.0.0.1:8399/api/screen?cols=150&rows=46" > /tmp/screen.json
          python3 -c "import json; d=json.load(open('/tmp/screen.json')); t=''.join(x for r in d['lines'] for x,_ in r); assert (d['cols'],d['rows'])==(150,46), d['cols']; assert 'skimonitor' in t; assert 'DEMO REPLAY' in t; assert 'quit' not in t; print('web frame ok:', len(d['lines']), 'rows,', len(t), 'cells')"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://evil.example' -H 'Content-Type: application/json' -d '{"a":"pause"}' http://127.0.0.1:8399/api/action)
          [ "$code" = "403" ] || { echo "cross-origin write not refused: $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"a":"pause"}' http://127.0.0.1:8399/api/action)
          [ "$code" = "204" ] || { echo "same-origin write failed: $code"; exit 1; }
          curl -s -D - -o /dev/null http://127.0.0.1:8399/ | grep -qi "content-security-policy" || { echo "CSP header missing"; exit 1; }
          echo "write-path guards ok"
          kill %1
